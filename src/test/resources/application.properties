# Test profile (automatico in src/test/resources):
# queste proprietà valgono SOLO durante `mvn test` e sovrascrivono quelle di produzione.

# Database embedded in-memory:
# - niente dipendenze da PostgreSQL locale o Docker
# - ogni run parte pulito e termina senza persistenza su disco
# - MODE=PostgreSQL aiuta compatibilità SQL (es. funzioni/query simili)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialect Hibernate per H2:
# istruisce Hibernate su SQL e mapping adatti al DB usato nei test.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Schema lifecycle per test deterministici:
# create-drop crea lo schema all'avvio dei test e lo rimuove a fine contesto.
spring.jpa.hibernate.ddl-auto=create-drop

# SQL log disattivato per output test più leggibile.
spring.jpa.show-sql=false

# Evita caricamento automatico di data.sql di produzione durante i test.
spring.sql.init.mode=never

# Mantiene ordine sicuro tra init datasource e bootstrap JPA.
spring.jpa.defer-datasource-initialization=true
