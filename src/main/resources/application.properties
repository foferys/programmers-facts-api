# PostgreSQL: valori da variabili d'ambiente (nessun dato sensibile in repository).
# Imposta SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# (vedi .env.example e README).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.database=POSTGRESQL
spring.servlet.multipart.enabled=true
#  imposta il dialetto che deve usare
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true


# [1] data.sql: esecuzione in sviluppo locale
# Forza l'esecuzione di data.sql (risorse/data.sql) per popolare il DB quando
# avvii l'app in locale contro Postgres (es. localhost:5434).
spring.sql.init.mode=always

# [2] data.sql: ordine di esecuzione
# Esegue data.sql DOPO che JPA ha creato/aggiornato le tabelle (altrimenti
# data.sql partirebbe prima e la tabella phrases non esisterebbe ancora).
spring.jpa.defer-datasource-initialization=true