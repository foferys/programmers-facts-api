# Sviluppo:  docker-compose --profile dev up     → server-dev con volumi (HTML/CSS aggiornati senza rebuild)
# Produzione: docker-compose --profile prod up   → server come da Dockerfile (deploy)
# ========================================================
# differenza sviluppo / produzione
# PRODUZIONE – servizio server (profilo prod):
# Usa il Dockerfile così com’è, nessun volume.

# Per avviare:
# docker-compose --profile prod up
# (prima build: docker-compose --profile prod up --build).
# ========================================================
# SVILUPPO – servizio server-dev (profilo dev):
# Stessa immagine del Dockerfile, ma con volumi su:
# ./src/main/resources/templates → /BOOT-INF/classes/templates
# ./src/main/resources/static → /BOOT-INF/classes/static
# Profilo Spring: docker,dev (attiva le proprietà di application-dev.properties).

# Per avviare:
# docker-compose --profile dev up
# (prima volta: docker-compose --profile dev up --build).

# Comandi da usare:
# Ambiente	 | Comando
# Sviluppo	 | docker-compose --profile dev up (o ... up --build la prima volta)
# Produzione | docker-compose --profile prod up
#
# Variabili d'ambiente: copia .env.example in .env e inserisci le credenziali (POSTGRES_USER,
# POSTGRES_PASSWORD, POSTGRES_DB). Nessun dato sensibile va committato; vedi README.


services:
  # Servizio PRODUZIONE: immagine dal Dockerfile, nessun volume (deploy)
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: programmers-facts-api:latest
    profiles:
      - prod
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - postgres

  # Servizio SVILUPPO: stessa immagine ma con volumi su templates/static (modifiche HTML/CSS senza riavvio)
  server-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: programmers-facts-api:latest
    profiles:
      - dev
    ports:
      - "8080:8080"
      - "5005:5005" # porta per il debugger
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker,dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # ======================================================
      # DEBUG REMOTO (server-dev)
      # ------------------------------------------------------
      # Questa variabile abilita l’agent di debug Java (JDWP)
      # dentro al container, sulla porta 5005.
      #
      # Significato dei parametri:
      # - transport=dt_socket  → comunicazione via socket TCP
      # - server=y             → la JVM *aspetta* un debugger
      # - suspend=n            → NON si blocca in attesa del debugger (l’app parte subito)
      # - address=*:5005       → ascolta su tutte le interfacce del container sulla porta 5005
      #
      # Insieme al mapping porte "5005:5005" qui sopra, VS Code
      # può collegarsi in attach all’app in esecuzione nel
      # container (configurazione "Attach - Spring Boot (Docker :5005)" in launch.json).
      # ======================================================
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    volumes:
      # Monta template e static così le modifiche si vedono senza ricostruire l'immagine
      - ./src/main/resources/templates:/BOOT-INF/classes/templates
      - ./src/main/resources/static:/BOOT-INF/classes/static
    networks:
      - postgres

  postgres:
    container_name: factsapi_container
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
      # Script SQL eseguiti solo al primo avvio (DB vuoto): schema + dati fissi, uguali su ogni PC
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5434:5432"
    networks:
      - postgres
    restart: unless-stopped
    # Healthcheck su Postgres: il server Spring parte solo quando il database è davvero pronto. 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  pgadmin:
    container_name: pgadmin_container_facts
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin4@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: -admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - postgres
    restart: unless-stopped

networks:
  postgres:
    driver: bridge

volumes:
  postgres:
  pgadmin:
